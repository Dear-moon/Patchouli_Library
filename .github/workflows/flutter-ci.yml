name: Flutter source checks

on:
  push:
    branches: ['main']
    paths: ['lib/**', 'test/**', 'android/**', 'shaders/**', 'assets/**', 'tools/**', '.githooks/**', 'pubspec.*', 'analysis_options.yaml', '.github/workflows/flutter-ci.yml']
  pull_request:
    paths: ['lib/**', 'test/**', 'android/**', 'shaders/**', 'assets/**', 'tools/**', '.githooks/**', 'pubspec.*', 'analysis_options.yaml', '.github/workflows/flutter-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: python3 tools/check_public_source.py
      - name: Validate committed source inventory
        run: |
          while read -r revision; do
            python3 tools/check_public_source.py --revision "$revision"
          done < <(git rev-list HEAD)
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Update mirror tests
        run: node --test tools/update-mirror/worker.test.mjs
      - name: Build isolated local-reading source preview
        run: flutter build apk --release --target-platform android-arm64
      - name: Native speech policy tests
        run: cd android && ./gradlew :app:testReleaseUnitTest
