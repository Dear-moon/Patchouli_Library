name: Flutter source checks

on:
  push:
    branches: ['master']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - name: Validate the exact public source commit
        run: python3 tools/check_public_source.py --revision "$(git rev-parse HEAD)"
      - run: flutter pub get
      - run: flutter analyze
